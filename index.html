<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스쿼드 메이커</title>
<meta name="theme-color" content="#17663a">
<meta name="description" content="동네축구·풋살 라인업 짜기와 경기 기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스쿼드 메이커">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2l4 2.9-1.5 4.7h-5L8 10.1z" fill="#fff"/><path d="M12 2.5v4.7M16 10.1l4.8-1.4M14.5 14.8l2.9 4M9.5 14.8l-2.9 4M8 10.1L3.2 8.7"/></svg></div>
      <div><h1>스쿼드 메이커</h1><small>동네축구 · 풋살 라인업 & 기록</small></div>
    </div>
    <span style="flex:1"></span>
    <button class="btn outline hidden" id="groupsBtn">모임 목록</button>
    <button class="btn primary hidden" id="installBtn" style="font-size:13px;padding:8px 12px">앱 설치</button>
  </header>

  <section class="groups-page hidden" id="vGroups" aria-labelledby="groupsTitle">
    <div class="section-heading">
      <h2 id="groupsTitle">모임 목록</h2>
      <button class="btn outline hidden" id="groupsBack">라인업으로</button>
      <button class="btn primary" id="addGroup">모임 만들기</button>
    </div>
    <div class="saved-list" id="groupList"></div>
  </section>

  <div class="group-name hidden" id="currentGroupName"></div>
  <nav class="nav hidden" id="nav">
    <button data-view="lineup" class="on">라인업</button>
    <button data-view="matches">경기 기록</button>
    <button data-view="stats">선수 기록</button>
  </nav>
  <div id="banner" class="banner hidden"></div>

  <!-- ===== 라인업 ===== -->
  <section id="vLineup" class="hidden">
    <div class="layout">
      <section class="card">
        <div class="squad-actions">
          <button class="btn outline" id="saveSquad">스쿼드 저장</button>
          <button class="btn outline" id="loadSquad">스쿼드 불러오기</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="ctrl-row">
          <div class="grp"><label>인원</label><select id="sizeSel" aria-label="한 팀 인원"></select></div>
          <div class="grp"><label>포메이션</label><select id="formation" aria-label="포메이션"></select>
            <button class="iconbtn" id="resetPos" title="위치 되돌리기" aria-label="위치 되돌리기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
        </div>
        <div class="pitch-outer"><div class="pitch-wrap">
          <div class="pitch" id="pitch">
            <svg class="lines" viewBox="0 0 68 105" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.65)" stroke-width=".35">
              <rect x="2" y="2" width="64" height="101"/><line x1="2" y1="52.5" x2="66" y2="52.5"/>
              <circle cx="34" cy="52.5" r="9.15"/><circle cx="34" cy="52.5" r=".5" fill="rgba(255,255,255,.65)"/>
              <rect x="13.85" y="2" width="40.3" height="16.5"/><rect x="24.84" y="2" width="18.32" height="5.5"/>
              <rect x="13.85" y="86.5" width="40.3" height="16.5"/><rect x="24.84" y="97.5" width="18.32" height="5.5"/>
            </svg>
            <div class="pitch-tag" id="pitchTag"></div>
            <div id="tokens"></div>
          </div>
        </div>
          <div class="side-col">
            <label class="ref-box"><span class="ref-h"><span class="whistle">심</span>심판 <small>모든 팀 공통</small></span><input id="refIn" placeholder="이름" maxlength="20" aria-label="심판"></label>
            <div class="subs" id="subs"></div>
          </div>
        </div>
        <div class="legend"><span><i style="border-color:#ff4d4f"></i>FW</span><span><i style="border-color:#2ecc71"></i>MF</span><span><i style="border-color:#3d8bff"></i>DF</span><span><i style="border-color:#ffc531"></i>GK</span></div>
        <div class="hint" id="hint"></div>
        <button class="btn img-btn" id="saveImg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>스쿼드 이미지 저장</button>
        <button class="btn primary start-match" id="startMatch">이 라인업으로 경기 기록 시작</button>
      </section>

      <aside class="side">
        <div class="card">
          <div class="section-heading">
            <h2>오늘 참가자 <span class="pill" id="total">0명</span></h2>
            <button class="mini-btn" id="choosePlayers">명단에서 선택</button>
          </div>
          <div class="add-row">
            <textarea id="nameInput" placeholder="이름 입력 후 Enter (쉼표·줄바꿈으로 여러 명)"></textarea>
            <button class="btn primary" id="addBtn">추가</button>
          </div>
          <p class="sub">새로 추가한 선수는 이 모임 명단에 저장돼요.</p>
          <button class="shot-btn hidden" id="shotBtn"><span class="kk"><svg width="13" height="13" viewBox="0 0 24 24" fill="#3a1d1d"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.4.3.7.6.5l4.3-2.8c.5.1.9.1 1.4.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg></span>카톡 투표 캡처로 추가</button>
          <input type="file" id="shotFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          <div class="past hidden" id="pastBox">
            <div class="past-title" style="display:flex;align-items:center;gap:6px"><span id="pastLabel">지난 경기 참가자</span><span style="flex:1"></span><button class="mini-btn" id="pastAll">모두 추가</button></div>
            <div class="chips" id="pastList"></div>
          </div>
        </div>

        <div class="card">
          <h2>대기 명단 <span class="pill" id="benchCount">0</span></h2>
          <div id="bench"><div class="chips" id="benchList"></div></div>
          <div class="actions">
            <button class="btn" id="fillRandom">빈자리 랜덤 채우기</button>
            <button class="btn" id="splitRandom">두 팀 랜덤 나누기</button>
            <button class="btn" id="clearTeam">이 팀 비우기</button>
            <button class="btn" id="copyText">명단 텍스트 복사</button>
          </div>
        </div>

        <div class="card">
          <h2>팀 설정</h2>
          <div class="team-row">
            <input id="teamName" class="name-in" maxlength="16" aria-label="팀 이름">
          </div>
          <div class="team-btns">
            <button class="btn" id="addTeam">+ 팀 추가</button>
            <button class="btn outline" id="delTeam">이 팀 삭제</button>
          </div>
          <p class="sub" id="teamSub"></p>
          <div id="otherBox"></div>
        </div>
        <div><button class="btn outline" id="resetAll" style="font-size:13px">라인업 새로 짜기</button></div>
      </aside>
    </div>
  </section>

  <!-- ===== 경기 기록 ===== -->
  <section id="vMatches" class="hidden">
    <div id="mList"></div>
    <div id="mDetail" class="hidden">
      <div class="md-head">
        <button class="back" id="mdBack">← 목록</button>
        <input type="date" id="mdDate" aria-label="경기 날짜">
        <input type="text" id="mdTitle" placeholder="경기 이름 (선택)" maxlength="60">
        <label class="ref-in"><span>심판</span><input type="text" id="mdRef" placeholder="이름 (선택)" maxlength="20"></label>
      </div>
      <div id="mdBody" class="md-grid"></div>
    </div>
  </section>

  <!-- ===== 선수 기록 ===== -->
  <section id="vStats" class="hidden"><div id="sBody"></div></section>

  <div class="foot" id="foot"></div>
  <div class="foot" style="display:flex;gap:8px;justify-content:center;margin-top:8px">
    <button class="btn outline" id="backupOut" style="font-size:12px;padding:6px 10px">백업 파일 저장</button>
    <button class="btn outline" id="backupIn" style="font-size:12px;padding:6px 10px">백업 불러오기</button>
    <input type="file" id="backupFile" accept="application/json,.json" hidden>
  </div>
</div>

<div class="loading" id="loading">기록 불러오는 중…</div>

<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="m-actions" id="mActions"></div></div></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js?v=5"></script>
<script src="js/lineup.js"></script>
<script src="js/matches.js"></script>
<script src="js/stats.js?v=5"></script>
<script src="js/setup.js"></script>
<script src="js/groups.js"></script>
<script src="js/squads.js"></script>
<script src="js/ocr.js"></script>
<script src="js/image.js"></script>
<script src="js/app.js"></script>
</body>
</html>
